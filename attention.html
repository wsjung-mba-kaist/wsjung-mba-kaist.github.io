  <div class="sr" aria-live="polite" aria-atomic="true" id="announce"></div>
  <noscript>이 수업의 슬라이드와 퀴즈를 진행하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
  <script>
const units = [
  {name:'문맥과 토큰', start:0, icon:'context'},
  {name:'Q · K · V', start:3, icon:'layers'},
  {name:'가중치와 출력', start:6, icon:'bars'},
  {name:'트랜스포머', start:11, icon:'network'},
  {name:'함께 푸는 퀴즈', start:15, icon:'quiz'}
];

// Each prompt belongs to the projected slide. Notes stay in the teacher's dialog.
const lessons = [
  {label:'문맥', title:'같은 <em>‘배’</em>,<br>어떻게 구별할까?', text:'‘오늘 먹을 배’와 ‘오늘 탈 배’를 읽어 보세요. 어떤 말이 달라져서 서로 다른 장면이 떠오르나요?', prompt:'가운데 말을 바꿔 보세요.', board:'문맥 실험', kind:'context',
    ask:'가운데 말을 가리고 “오늘 □ 배”만 보여 준다면, 어떤 배인지 알 수 있을까요?', note:'먹을 때 떠올리는 과일과 탈 때 떠올리는 배를 말하게 해 주세요. 문맥은 앞뒤 표현이나 상황처럼 뜻을 해석하는 데 쓰이는 단서입니다. 이 그림은 사람이 읽는 예문을 시각화한 것입니다.'},
  {label:'토큰과 임베딩', title:'글이 어떻게<br><em>숫자</em>가 될까?', text:'토큰(token)은 모델이 글을 나누어 처리하는 단위예요. 토큰마다 임베딩(embedding)이라는 숫자 벡터를 찾아옵니다.', prompt:'단어 크기의 예시 토큰을 골라 보세요.', board:'토큰의 입력 표현', kind:'embedding',
    ask:'같은 토큰 ID로 같은 임베딩 표를 두 번 조회하면 어떤 벡터가 나올까요?', note:'같은 벡터가 나옵니다. 벡터는 여기서 순서가 있는 숫자의 목록입니다. 토큰을 나누는 방법은 모델마다 달라서 한 단어가 여러 토큰이 될 수 있습니다. 원래 트랜스포머는 임베딩에 위치 인코딩을 더합니다. 실제 벡터의 각 숫자에 사람이 뜻을 하나씩 붙여 두지는 않습니다.'},
  {label:'어텐션', title:'주변 정보를<br><em>얼마씩</em> 가져올까?', text:'어텐션(attention)은 한 위치에서 참고할 정보마다 가중치를 계산하고, 그 비율로 정보를 더하는 연산이에요.', prompt:'가중치를 움직여 두 값이 섞이는 모습을 보세요.', board:'가중합 실험', kind:'blend',
    ask:'두 값이 8과 4일 때, 8 쪽의 비율을 높이면 결과는 어디로 움직일까요?', note:'8에 가까워집니다. 계산은 각 값에 가중치를 곱한 뒤 모두 더하는 가중합입니다. 여기서는 벡터의 성분 하나만 꺼내 생각합니다. 다음 단원에서 모델이 이 비율을 구하는 방법을 다룹니다.'},
  {label:'쿼리 · 키 · 값', title:'토큰 하나에서<br><em>세 벡터</em>를 만들어요', text:'셀프 어텐션은 각 토큰의 입력 벡터를 세 방식으로 변환해 쿼리(Query), 키(Key), 값(Value)을 만들어요.', prompt:'Q, K, V를 하나씩 골라 역할을 확인하세요.', board:'세 벡터의 역할', kind:'qkv',
    ask:'한 토큰은 쿼리만 만들까요, 아니면 키와 값도 만들까요?', note:'셀프 어텐션에서는 각 토큰이 세 가지를 모두 만듭니다. x에 서로 다른 학습 행렬 W_Q, W_K, W_V를 곱해 q, k, v를 만듭니다. 행렬은 숫자를 직사각형으로 배열한 표예요. 같은 층의 같은 헤드 안에서는 모든 위치에 같은 세 변환을 씁니다. 학습할 때는 예측 오차를 줄이는 방향으로 행렬의 수들을 조금씩 조정합니다. 학습이 끝나도 Q, K, V 벡터는 입력에 따라 달라집니다.', source:true},
  {label:'내적', title:'쿼리와 키로<br><em>점수</em>를 구해요', text:'내적(dot product)은 같은 자리에 있는 수끼리 곱하고 모두 더한 수예요. ‘배’의 쿼리 (1, 1)을 세 키와 비교해 볼까요?', prompt:'비교할 키를 바꿔 보세요.', board:'내적 계산', kind:'dot',
    ask:'두 벡터에 양수가 들어 있어도 내적이 0이 될 수 있을까요?', note:'예를 들어 (1, 1)과 (1, −1)의 내적은 1 − 1 = 0입니다. 쿼리 하나를 고정하고 모든 허용된 키와 내적을 구합니다. 이 수업의 Q, K, V는 직접 만든 계산 예시이며 모델에서 측정한 값이 아닙니다. 내적은 방향과 크기의 영향을 모두 받습니다.', source:true},
  {label:'점수 조정', title:'내적의 크기를<br><em>조절</em>해요', text:'쿼리와 키에 들어 있는 수의 개수를 차원 dₖ라고 해요. 스케일드 내적 어텐션은 각 내적을 √dₖ로 나누어 점수의 크기를 조절합니다.', prompt:'나누기 전후의 점수를 비교해 보세요.', board:'스케일링', kind:'scale',

  for(const [x,y,r] of [[-179,42,3.4],[150,-27,2.8],[98,65,2],[-118,-32,2.2]])dot(x,y,r,'#b3a2ee');

    const getRadius=t=>58*Math.pow(Math.max(0,Math.sin(Math.PI*t)),.52)*
      (.50+.78*Math.exp(-Math.pow((t-.72)/.34,2)));
    const surface=c.createLinearGradient(-65,-75,67,65);

function quizMarkup(){
  const i=page-lessons.length,q=questions[i];
  return '<div class="slide-copy quiz-copy"><div class="unit-label"><span class="unit-num">'+icon('quiz')+'</span>함께 푸는 퀴즈</div><div class="quiz-num">Q'+pad(i+1)+' <span>/ '+pad(questions.length)+'</span></div><h2>'+q[1]+'</h2><p class="explain">손가락으로 답의 번호를 표시하고, 이유를 이야기해 보세요.</p><button class="reveal" id="reveal" aria-expanded="'+state.revealed+'">'+icon('eye')+(state.revealed?'정답 가리기':'정답과 해설 보기')+'</button></div><section class="quiz-panel" aria-label="선택지와 해설"><div class="quiz-panel-title">'+icon('list')+' 선택지 <span>'+q[0]+'</span></div><div class="answers">'+q[2].map((v,j)=>'<button data-answer="'+j+'" aria-pressed="'+(state.marked===j)+'" class="answer '+(state.marked===j?'marked ':'')+(state.revealed&&q[3]===j?'correct':'')+'"><b>'+(j+1)+'</b><span>'+v+'</span>'+(state.revealed&&q[3]===j?'<i>정답</i>':'')+'</button>').join('')+'</div>'+(state.revealed?'<div class="feedback" role="status"><strong>정답 '+(q[3]+1)+'번</strong><p>'+q[4]+'</p></div>':'')+'</section>';
}
function renderQuiz(focusId){
  byId('slide').innerHTML=quizMarkup(); if(focusId)byId(focusId)?.focus({preventScroll:true});
}
function render(){
  if(observer)observer.disconnect();
  const isQuiz=page>=lessons.length,u=unitAt(page);state=defaults();
  if(isQuiz)lastQuiz=page;else lastLesson=page;
  byId('lectureTab').classList.toggle('active',!isQuiz);byId('quizTab').classList.toggle('active',isQuiz);
  byId('lectureTab').setAttribute('aria-pressed',!isQuiz);byId('quizTab').setAttribute('aria-pressed',isQuiz);
  byId('pageNow').textContent=pad(page+1);byId('pageTotal').textContent=total;
  byId('progress').setAttribute('aria-valuenow',page+1);byId('progress').firstElementChild.style.width=(page+1)/total*100+'%';
  byId('prev').disabled=page===0;byId('next').innerHTML=(page===total-1?'수업 마치기':page===lessons.length-1?'퀴즈 시작':isQuiz?'다음 문제':'다음 슬라이드')+icon('forward');
  byId('slide').className='slide '+(isQuiz?'quiz-slide':'lesson-slide');
  if(isQuiz)renderQuiz();else {byId('slide').innerHTML=lecture();paintBoard();}
  byId('chapters').innerHTML=units.map((unit,i)=>'<button class="chapter '+(u===i?'active':'')+'" data-go="'+unit.start+'" '+(i===u?'aria-current="step"':'')+'><span class="chapter-icon tone-'+i+'">'+icon(unit.icon)+'</span><span><small>'+(i===4?'QUIZ':'CHAPTER '+pad(i+1))+'</small><b>'+unit.name+'</b></span></button>').join('');
  byId('announce').textContent=(page+1)+'번째 슬라이드. '+(isQuiz?questions[page-lessons.length][1]:cleanTitle(lessons[page].title));
}
function showDialog(title,html){
  byId('dialogTitle').textContent=title;byId('dialogBody').innerHTML=html;
  if(!byId('dialog').open)byId('dialog').showModal();
  byId('dialogBody').scrollTop=0;
}
function toc(){
  showDialog('전체 목차','<div class="toc">'+units.map((u,i)=>{
    const end=units[i+1]?.start??total;
    return '<section><h3>'+icon(u.icon)+u.name+'</h3>'+Array.from({length:end-u.start},(_,j)=>{const n=u.start+j;return '<button class="'+(n===page?'here':'')+'" data-go="'+n+'"><b>'+pad(n+1)+'</b><span>'+(n<lessons.length?cleanTitle(lessons[n].title):'퀴즈 '+(j+1)+' · '+questions[j][0])+'</span></button>';}).join('')+'</section>';
  }).join('')+'</div>');
}
function notes(){
  const s=lessons[page];
  const src='<p class="sources"><a href="https://arxiv.org/html/1706.03762#S3.SS2" target="_blank" rel="noopener">Vaswani 외, 「Attention Is All You Need」 (2017)</a></p>';
  showDialog('수업 노트',s?'<div class="note-body"><p class="note-over">'+pad(page+1)+' / '+total+' · '+s.label+'</p><h3>함께 생각할 질문</h3><p class="ask">'+s.ask+'</p><h3>설명할 때</h3><p>'+s.note+'</p>'+(s.source?src:'')+(s.interpretation?'<p class="sources"><a href="https://aclanthology.org/N19-1357/" target="_blank" rel="noopener">Jain·Wallace, 「Attention is not Explanation」 (2019)</a></p>':'')+'</div>':'<div class="note-body"><h3>함께 푸는 방법</h3><p>질문을 읽고 잠시 생각할 시간을 주세요. 모두 동시에 손가락으로 번호를 표시한 다음, 서로 다른 답을 고른 학생의 이유를 들어 보세요. 발표자가 선택지를 표시한 뒤 ‘정답과 해설 보기’를 눌러 함께 확인할 수 있어요.</p></div>');
}
function finish(){
  showDialog('수업 마무리','<div class="note-body"><span class="finish-icon">'+icon('check')+'</span><h3>어텐션을 한 문장으로 말해 볼까요?</h3><p>쿼리와 키로 각 위치의 가중치를 구하고, 그 비율로 값 벡터를 더해 문맥을 반영한 출력을 만들어요.</p><div class="finish-actions"><button class="control" data-go="14">계산 다시 보기</button><button class="primary" data-go="0">처음으로</button></div></div>');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-go')){move(Number(b.dataset.go));return;}
  if(b.hasAttribute('data-pick')){
    state.choice=Number(b.dataset.pick);
    byId('controls').querySelectorAll('button').forEach((btn,i)=>{btn.classList.toggle('on',i===state.choice);btn.setAttribute('aria-pressed',String(i===state.choice));});
    paintBoard();return;
  }
  if(b.hasAttribute('data-answer')){
    if(state.revealed)return;
    state.marked=Number(b.dataset.answer);
    byId('slide').querySelectorAll('[data-answer]').forEach((btn,i)=>{btn.classList.toggle('marked',i===state.marked);btn.setAttribute('aria-pressed',i===state.marked);});return;
  }
  if(b.id==='reveal'){state.revealed=!state.revealed;renderQuiz('reveal');}
});
document.addEventListener('input',e=>{
  if(e.target.id==='blend'){state.blend=Number(e.target.value);byId('rangeValue').value=state.blend+'%';paintBoard();}
  if(e.target.id==='lab'){state.t=Number(e.target.value);byId('rangeValue').value=fmt(state.t);paintBoard();}
});
byId('prev').onclick=()=>move(page-1);byId('next').onclick=nextPage;
byId('lectureTab').onclick=()=>move(lastLesson);byId('quizTab').onclick=()=>move(lastQuiz);
byId('notes').onclick=notes;byId('indexBtn').onclick=toc;byId('close').onclick=()=>byId('dialog').close();
byId('dialog').onclick=e=>{if(e.target===byId('dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};
function fullUI(){
  const on=!!document.fullscreenElement||document.body.classList.contains('wide');
  document.body.classList.toggle('presenting',on);
  const toolbar=document.querySelector('.tools');
  if(on)byId('fullscreen').before(toolbar);else document.querySelector('.section-head').append(toolbar);
  byId('fullLabel').textContent=on?'전체 화면 종료':'전체 화면';
  byId('fullscreen').setAttribute('aria-pressed',on);
}
byId('fullscreen').onclick=async()=>{
  if(document.fullscreenElement){await document.exitFullscreen();return;}
  if(document.body.classList.contains('wide')){document.body.classList.remove('wide');fullUI();return;}
  try{await document.documentElement.requestFullscreen();}catch{document.body.classList.add('wide');fullUI();}
};
document.addEventListener('fullscreenchange',fullUI);
document.addEventListener('keydown',e=>{
  if(byId('dialog').open||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();nextPage();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(page-1);}
  if(e.key==='Escape'&&document.body.classList.contains('wide')){document.body.classList.remove('wide');fullUI();}
});
window.addEventListener('hashchange',()=>{page=readPage();render();});
render();

</script>
