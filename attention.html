:root{font-family:"Class Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#252435;background:#f6f6fa;--violet:#6944d1;--violet-dark:#5333ab;--text:#252435;--muted:#636371;--line:#e2e1e9;--ink:#292638;--lime:#d6f49b;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;word-break:keep-all;overflow-wrap:break-word}button,a,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default}button,a{touch-action:manipulation}button{border:0;background:none}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #936cf0;outline-offset:3px}svg{display:block;width:1.18em;height:1.18em;flex:none}button svg{pointer-events:none}
.mast{background:#fff;border-bottom:1px solid var(--line)}.mast-inner{max-width:1520px;width:calc(100% - 9vw);margin:auto;min-height:74px;display:flex;align-items:center;gap:clamp(32px,6vw,92px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:1.31rem;font-weight:820;letter-spacing:-.055em;white-space:nowrap}.brandmark{width:37px;height:37px;border-radius:11px;background:var(--violet);display:grid;place-items:center;color:#fff}.brandmark svg{width:27px;height:27px;stroke-width:1.35}.mode{display:flex;align-self:stretch;gap:27px}.mode button{position:relative;display:flex;gap:8px;align-items:center;padding:0 2px;color:#686675;font-weight:620;white-space:nowrap}.mode .active{color:var(--violet)}.mode .active:after{content:"";position:absolute;height:3px;background:var(--violet);border-radius:4px 4px 0 0;bottom:0;left:0;right:0}.mode button:hover,.tool:hover{color:var(--violet)}
.control,.primary,.tool,.reveal,.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:660;white-space:nowrap}.control,.primary,.reveal{min-height:41px;padding:9px 16px;border-radius:9px;font-size:.96rem}.control{border:1px solid #dbdae4;background:#fff}.control:hover:not(:disabled){border-color:#ad97dc;background:#faf8ff}.control:disabled{color:#aba9b4;background:#fbfbfd;border-color:#e8e7ed}.fullscreen{margin-left:auto}.tool{color:#61606f;padding:9px 8px}.tools{display:flex;gap:12px;align-items:center}
.shell{width:calc(100% - 9vw);max-width:1520px;margin:auto;padding:clamp(25px,3.1vh,44px) 0 30px}.section-head,.chapter-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}.section-head{margin-bottom:18px}.course-kicker{display:flex;align-items:center;gap:7px;font-size:.85rem;color:#676078;font-weight:650;letter-spacing:.025em}.course-kicker i{width:15px;height:3px;background:var(--violet);border-radius:5px}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.9rem,2.45vw,2.55rem);letter-spacing:-.058em;line-height:1.18;margin-top:5px;font-weight:800}
.deck{border-radius:20px;border:1px solid #dedde7;background:white;box-shadow:0 6px 20px -14px #30283d3b;overflow:hidden}
.slide{display:grid;grid-template-columns:46% 54%;min-height:clamp(389px,49.8vh,560px);padding:16px;position:relative}

  <noscript>이 수업의 슬라이드와 퀴즈를 진행하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
  <script>
// Each frame is a single, presenter-controlled reveal.
const lessons = [
  {
    label:'문맥', kind:'context', board:'말 한마디 실험', title:'<em>‘배’</em>를 들으면<br>무엇이 떠오르나요?',
    steps:[
      ['단어만 듣기','잠깐 눈을 감고 ‘배’를 떠올려 보세요. 옆 친구도 같은 것을 생각했을까요?','각자 떠올린 것을 한 가지씩 말해 보세요.'],
      ['첫 단서 열기','앞에 ‘먹을’을 붙였어요. 아까 떠올린 여러 가지 배 중에서 어느 배가 가장 자연스럽나요?','무엇을 보고 과일이라고 생각했나요?'],
      ['단서 바꾸기','‘먹을’을 ‘탈’로 바꾸니 물에 뜨는 배가 떠오르죠. 이렇게 어떤 말의 뜻을 짐작하게 해 주는 앞뒤의 말을 <b>문맥</b>이라고 해요.','뜻이 달라진 말과 실제로 바꾼 말을 각각 짚어 보세요.']
    ],
    say:'제가 단어를 딱 하나만 말할게요. “배.” 그릴 수 있는 것을 떠올려 보세요. 과일, 배가 아플 때의 배, 물에 뜨는 배도 나오겠지요. 이제 앞말 하나를 열어 볼게요.',
    ask:'‘먹을 배’와 ‘탈 배’에서 글자가 똑같은데 다르게 읽힌 말은 무엇인가요?', answer:'‘배’예요. 앞말인 ‘먹을’과 ‘탈’이 서로 다른 뜻을 떠올리게 했어요.',
    bridge:'우리는 글을 보자마자 단서를 찾았어요. 글을 다루는 컴퓨터 프로그램인 언어 모델은 무엇부터 할까요?'
  },
  {
    label:'토큰', kind:'tokens', board:'글을 조각으로 보기', title:'모델은 글을<br><em>어떤 단위로</em> 볼까요?',
    steps:[
      ['말 읽기','사람은 ‘먹을 배’를 통째로 읽을 수 있어요. 모델이 이 글을 받아서 처리할 때는 먼저 작은 조각으로 나눠요.','어디에서 나눌 수 있을지 손가락으로 짚어 보세요.'],
      ['조각으로 나누기','이 수업에서는 ‘먹을’과 ‘배’ 두 조각으로 나눠 볼게요. 모델이 처리하는 이런 글 조각을 <b>토큰(token)</b>이라고 해요.','각 칸을 하나의 토큰으로 읽어 보세요.'],
      ['다른 나누기 보기','어떤 모델에서는 ‘먹을’도 더 잘게 나눌 수 있어요. 앞으로는 처음의 두 조각을 써서 ‘배’가 ‘먹을’을 어떻게 참고하는지 볼 거예요.','두 예시에서 달라진 것은 글의 뜻일까요, 조각의 경계일까요?']
    ],
    say:'종이에 “먹을 배”라고 쓰고 가위로 자른다고 생각해요. 오늘은 ‘먹을’ 한 장, ‘배’ 한 장을 책상에 놓을게요.',
    ask:'토큰은 언제나 띄어쓰기 단위일까요?',answer:'아니요. 글을 어떤 조각으로 나눌지는 모델이 사용하는 나누기 규칙에 따라 달라요.',
    bridge:'조각을 만들었어요. 이제 컴퓨터가 계산할 수 있도록 각 조각을 숫자로 나타내 봅시다.'
  },
  {
    label:'벡터와 임베딩', kind:'embedding', board:'토큰의 첫 숫자 목록', title:'글 조각을 어떻게<br><em>숫자로</em> 나타낼까요?',
    steps:[
      ['숫자 목록 보기','컴퓨터는 숫자로 계산해요. 그래서 토큰마다 여러 숫자를 한 줄로 늘어놓아 그 토큰을 나타내요. 이렇게 순서가 있는 숫자 목록을 여기서는 <b>벡터(vector)</b>라고 해요.','계산하지 말고 숫자가 들어가는 칸만 살펴보세요.'],
      ['두 문장 비교하기','모델에는 토큰마다 처음에 꺼내 쓸 벡터가 있어요. 이를 <b>토큰 임베딩(embedding)</b>이라고 해요. 같은 모델에서 같은 ‘배’ 토큰은 어느 문장에 나오든 같은 목록으로 시작해요.','그러면 ‘먹을 배’와 ‘탈 배’의 차이는 어떻게 담을까요?']
    ],
    say:'“배” 카드를 뒤집었더니 숫자가 여러 개 적혀 있다고 상상해요. 각각의 숫자를 외울 필요는 없어요. 컴퓨터가 사용할 수 있는 꼴로 바꿨다는 점만 기억해요.',
    ask:'두 문장에서 ‘배’의 처음 목록이 같다면, 그 목록만 보고 과일인지 탈것인지 가를 수 있을까요?',answer:'그 목록만으로는 두 문장을 구별할 수 없어요. 주변 토큰에 들어 있는 정보가 필요해요.',
    bridge:'주변 정보를 얼마나 받아들일 수 있을까요? 먼저 눈으로 보이는 두 가지 색을 섞어 봅시다.',
    more:'화면의 숫자는 설명용 예시예요. 실제 임베딩은 학습을 통해 정해지며, 각각의 숫자에 사람이 정해 놓은 뜻이 하나씩 붙어 있지는 않아요. 여기서 비교한 것은 위치 정보를 반영하기 전의 토큰 임베딩이에요.'
  },
  {
    label:'가중치', kind:'colors', board:'두 색 섞기', title:'두 색을 <em>얼마씩</em><br>섞어 볼까요?',
    steps:[
      ['반반 섞기','화면 속 파랑과 분홍을 반씩 섞으면 가운데 색이 나와요. 파랑의 몫을 늘리면 결과가 어느 쪽 색에 가까워질까요?','먼저 결과 색을 예상해 보세요.'],
      ['비율 바꾸기','막대를 움직여 보세요. 더 많이 담은 쪽의 색이 결과에 더 많이 드러나요. 이렇게 각 재료를 얼마씩 반영할지 나타내는 수를 <b>가중치(weight)</b>라고 해요.','파랑의 몫을 키웠다가 반반으로 되돌려 보세요.']
    ],
    say:'두 색을 반씩 섞은 화면이에요. 파랑을 더 많이 넣으면 어떻게 될지 말해 볼까요? 한 친구가 예상하면 다른 친구가 막대를 움직여 확인해 주세요.',
    ask:'파랑의 몫이 크면 분홍의 몫은 꼭 사라질까요?',answer:'둘 다 조금씩 들어갈 수 있어요. 어느 쪽이 더 많이 반영되는지가 달라져요.',
    bridge:'색의 양을 조절한 것처럼, 모델도 여러 토큰의 정보를 서로 다른 비율로 섞을 수 있어요.'
  },
  {
    label:'어텐션', kind:'attention', board:'‘배’에 모이는 정보', title:'주변 말의 정보도<br><em>섞을 수</em> 있을까요?',
    steps:[
      ['한 곳 정하기','‘먹을 배’에서 지금 자세히 알아볼 자리를 ‘배’로 정해요. 이 자리는 ‘먹을’에 담긴 정보와 ‘배’ 자신에 담긴 정보를 모두 받을 수 있어요.','정보를 받는 곳은 어느 자리인가요?'],
      ['정보 모으기','모델은 지금 자리에서 각 토큰을 얼마나 참고할지 정하고, 그 비율로 정보를 섞어요. 이 계산이 <b>어텐션(attention)</b>이에요. 덕분에 ‘배’의 숫자 목록에 주변 말의 정보가 담길 수 있어요.','굵은 선과 가는 선 중 어느 쪽 정보가 더 많이 섞였나요?']
    ],
    say:'책상 위에 두 장의 카드를 놓고 “배” 카드를 가리켜요. 지금 만들 것은 이 자리에서 쓸 새 숫자 목록이에요. 앞말의 정보를 많이 받을 수도, 자기 정보를 조금 받을 수도 있어요.',
    ask:'정보를 섞고 나면 화면에 새 낱말 하나가 적히나요?',answer:'이 단계에서 생기는 것은 그 자리에서 쓸 숫자 목록이에요. 모델의 다음 계산이 그 목록을 사용해요.',
    bridge:'아까는 우리가 손으로 비율을 정했지요. 모델은 그 비율을 어떻게 정할까요? 학교 게시판에서 정보를 찾는 상황을 빌려 봅시다.', source:true
  },
  {
    label:'쿼리', kind:'query', board:'체육대회 게시판', title:'게시판에서<br><em>무엇을</em> 찾고 있나요?',
    steps:[
      ['궁금한 것 정하기','운동화를 신고 나왔는데 친구들이 보이지 않아요. 체육대회 공지에서 무엇을 먼저 찾아보고 싶나요?','친구들에게 물어볼 말을 한 문장으로 만들어 보세요.'],
      ['쿼리 만나기','“어디로 모이면 되지?” 찾고 싶은 것이 정해지면 어떤 안내를 살필지도 달라져요. 어텐션에서 <b>쿼리(Query, Q)</b>는 지금 위치가 어떤 정보와 잘 맞는지 비교할 기준이 되는 벡터예요.','게시판 이야기에서 쿼리 역할을 한 것은 무엇인가요?']
    ],
    say:'제가 늦게 도착했어요. “몇 시예요?”보다 “어디로 가요?”가 먼저 궁금하겠지요. 같은 게시판 앞에서도 내 궁금증에 따라 볼 곳이 달라져요.',
    ask:'“어디로 모이지?”는 모델 속에 실제로 적힌 문장인가요?',answer:'이것은 역할을 이해하기 위한 사람의 질문이에요. 모델 속 쿼리는 현재 토큰의 숫자 목록을 변환해 만든 또 다른 숫자 목록이에요.',
    bridge:'궁금한 것을 정했어요. 안내문 두 장 중 어느 쪽이 더 잘 맞는지 빠르게 비교하려면 무엇을 볼까요?', source:true
  },
  {
    label:'키', kind:'key', board:'질문과 제목 비교하기', title:'어떤 <em>안내문</em>을<br>먼저 펼칠까요?',
    steps:[
      ['제목만 보기','게시판에는 ‘모이는 장소’와 ‘시작 시간’ 안내가 있어요. “어디로 모이지?”와 더 잘 맞는 제목을 찾아보세요.','둘 중 하나를 고르고 이유를 말해 보세요.'],
      ['질문 바꿔 보기','제목을 보고 궁금증과 맞는지 비교했지요. <b>키(Key, K)</b>는 각 위치가 쿼리와 비교하기 위해 내놓는 벡터예요. 같은 키라도 어떤 쿼리와 비교하느냐에 따라 점수가 달라져요.','“언제 시작하지?”로 바꿔 보세요. 제목도 바꿀 필요가 있었나요?']

    say:'두 안내문의 제목은 그냥 두고 질문만 바꿔 볼게요. 장소가 궁금할 때와 시간이 궁금할 때 각각 어느 쪽을 가리키고 싶나요?',

// The illustration is drawn locally, including the printed-dot shading.
function drawContext(canvas, boat) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const c = canvas.getContext('2d');
  const scale = Math.min(rect.width / 490, rect.height / 245);
  c.scale(dpr, dpr);
  c.translate(rect.width / 2, rect.height / 2);
  c.scale(scale, scale);
  let seed = 48262;
  const random = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  const dot = (x,y,r,color) => { c.fillStyle=color; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); };
  function ellipse(x,y,rx,ry,angle,color,dash=[]) {
    c.beginPath(); c.strokeStyle=color; c.lineWidth=.8; c.setLineDash(dash);
    c.ellipse(x,y,rx,ry,angle,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  }
  function line(points,color,width=1) {
    c.beginPath(); c.strokeStyle=color; c.lineWidth=width;
    points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y)); c.stroke();
  }
  function spark(x,y,r) {
    c.fillStyle='#b8a9f3';c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x+1,y-1,x+r,y);
    c.quadraticCurveTo(x+1,y+1,x,y+r);c.quadraticCurveTo(x-1,y+1,x-r,y);c.quadraticCurveTo(x-1,y-1,x,y-r);c.fill();
  }
  ellipse(0,14,188,55,-.28,'#7770a1');
  ellipse(-1,12,144,84,-.48,'#666087',[2,6]);
  ellipse(0,14,154,36,.24,'#51496f');
  for(const [x,y,r] of [[-179,42,3.4],[150,-27,2.8],[98,65,2],[-118,-32,2.2]])dot(x,y,r,'#b3a2ee');
  spark(-136,-71,5);spark(172,60,4);spark(115,-88,3.5);
  if(boat===null) {
    c.save();
    const face=c.createLinearGradient(-50,-65,45,68);
    face.addColorStop(0,'#f1f9b0');face.addColorStop(1,'#b0da80');
    c.fillStyle=face;c.textAlign='center';c.textBaseline='middle';
    c.font='800 130px "Class Sans","Malgun Gothic",sans-serif';
    c.fillText('배',0,6);
    c.restore();return;
  }
  if(!boat) {
    c.save();c.translate(-2,6);c.rotate(.19);
    const getRadius=t=>58*Math.pow(Math.max(0,Math.sin(Math.PI*t)),.52)*
      (.50+.78*Math.exp(-Math.pow((t-.72)/.34,2)));
    const surface=c.createLinearGradient(-65,-75,67,65);
    surface.addColorStop(0,'#eff9ac');surface.addColorStop(.48,'#c7ed77');surface.addColorStop(1,'#7e9e64');
    c.fillStyle=surface;c.beginPath();
    for(let j=0;j<=180;j++) {const t=j/180,x=getRadius(t)-5*(1-t);if(j===0)c.moveTo(x,-81);else c.lineTo(x,-81+172*t);}
    for(let j=180;j>=0;j--) {const t=j/180;c.lineTo(-getRadius(t)-5*(1-t),-81+172*t);}
    c.closePath();c.fill();
    // A regular halftone screen with density modulated by simulated surface light.
    for(let j=0;j<100;j++) {
      const t=(j+.4)/100, r=getRadius(t),y=-81+t*172, dx=-5*(1-t);
      for(let x=-70+(j%2)*.88;x<70;x+=1.86) {
        const nx=(x-dx)/r;if(Math.abs(nx)>.995)continue;
        const z=Math.sqrt(1-nx*nx), shade=Math.max(0,Math.min(1,.51+.53*nx-.34*z+.22*t));
        const sz=.12+1.09*shade+random()*.24;
        dot(x,y,sz,'rgba(34,53,51,'+(.40+.47*shade)+')');
      }
    }
    for(let j=0;j<1350;j++){
      const t=random(),r=getRadius(t),x=(random()*2-1)*r-5*(1-t);
      dot(x,-81+t*172,.15+random()*.50,random()>.46?'#eff4a5':'#627747');
    }
    c.lineCap='round';c.beginPath();c.moveTo(-5,-80);c.quadraticCurveTo(-4,-94,5,-107);c.strokeStyle='#9b9862';c.lineWidth=5;c.stroke();
    c.beginPath();c.moveTo(-5,-80);c.quadraticCurveTo(-2,-98,51,-105);c.quadraticCurveTo(35,-78,-5,-80);c.fillStyle='#accf76';c.fill();
    c.save();c.clip();for(let i=-9;i<54;i+=2.4)line([[i-7,-77],[i+10,-105]],'#4b6754',.95);c.restore();
    line([[-5,-80],[24,-94],[49,-104]],'#e3ea9e',1);
    c.restore();
  } else {
    c.save();c.translate(-4,0);
    function sail(path,light,dark){
      c.beginPath();path(c);c.closePath();let grad=c.createLinearGradient(-80,-75,85,75);grad.addColorStop(0,light);grad.addColorStop(1,dark);c.fillStyle=grad;c.fill();
      c.save();c.clip();for(let y=-105;y<90;y+=2.2)for(let x=-110+(Math.round(y)%2);x<115;x+=2.45)dot(x,y,.23+((x+110)/225)*.73+random()*.22,'rgba(43,48,65,.68)');c.restore();
    }
    sail(p=>{p.moveTo(0,-98);p.quadraticCurveTo(-24,-17,-72,40);p.quadraticCurveTo(-35,32,-2,36);},'#f6fac3','#c5e67d');
    sail(p=>{p.moveTo(5,-79);p.quadraticCurveTo(27,-16,82,38);p.quadraticCurveTo(45,27,6,32);},'#d8e9af','#8db47b');
    line([[2,-103],[2,50]],'#edf4bd',3);
    sail(p=>{p.moveTo(-102,45);p.quadraticCurveTo(-29,52,100,41);p.lineTo(75,64);p.quadraticCurveTo(-3,85,-68,68);},'#d9ef9a','#78955e');
    line([[-86,54],[-21,60],[70,57]],'#384c49',2);
    for(let j=0;j<4;j++){const y=77+j*5;line([[-103+j*15,y],[-66,y-1],[1,y+1],[72-j*10,y]],'rgba(186,200,225,'+(.55-j*.09)+')');}
    c.restore();
  }
  const px=boat?58:45,py=boat?-42:-34;

}

</script><script>
function caption(text) { return '<p class="board-note">'+text+'</p>'; }
function chip(text, lit=false) {return '<span class="piece'+(lit?' lit':'')+'">'+text+'</span>';}
function sentence(parts, active=-1) {return '<div class="pieces">'+parts.map((t,i)=>chip(t,i===active)).join('')+'</div>';}
function bigWord(text) {return '<div class="big-word">'+text+'</div>';}
function boardRow(label,content) {return '<div class="example-row"><span>'+label+'</span><strong>'+content+'</strong></div>';}
function menu(labels, selected, name) {
  return '<div class="picks" role="group" aria-label="'+name+'">'+labels.map((v,i)=>'<button class="pick '+(selected===i?'on':'')+'" data-select="'+i+'" aria-pressed="'+(i===selected)+'">'+v+'</button>').join('')+'</div>';
}
function slider(id,value,label,unit,min,max,step) {
  return '<div class="range-box"><label for="'+id+'">'+label+'</label><output id="rangeValue" for="'+id+'">'+value+unit+'</output><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"></div>';
}
function frameControls(s) {
  if(s.kind==='colors'&&frame===1)return slider('ratio',state.ratio,'파랑의 몫','%',0,100,5);
  if(s.kind==='score'&&frame===1)return slider('score',state.score,'‘먹을’의 예시 점수','',0,3,1);
  if(s.kind==='key'&&frame===1)return menu(['어디로 모이지?','언제 시작하지?'],state.choice,'찾는 질문');
  if(s.kind==='output'&&frame===1)return menu(['먹을 배','탈 배'],state.choice,'비교할 예문');
  if(s.kind==='self'&&frame===1)return menu(['‘배’에서 보기','‘먹을’에서 보기'],state.choice,'받는 자리');
  if(s.kind==='game'&&frame===3)return menu(['세 장과 한 장','두 장씩'],state.choice,'종이를 나누는 방법');
  return '';
}
const pink=[247,156,184],blue=[123,180,246],neutral=[208,205,222],green=[175,215,125];
function mixed(a,b,ratio){return 'rgb('+a.map((v,i)=>Math.round(v*ratio+b[i]*(1-ratio))).join(',')+')';}
function pigment(color,text) {return '<div class="pigment"><i style="--paint:'+color+'"></i><b>'+text+'</b></div>';}
function mixture(){
  const p=state.ratio;
  return '<div class="paint-tray">'+pigment('rgb('+blue+')','파랑')+'<span>+</span>'+pigment('rgb('+pink+')','분홍')+'<span>=</span>'+pigment(mixed(blue,pink,p/100),'섞은 색')+'</div>'+
    '<div class="mix-track"><i style="flex:'+p+';background:rgb('+blue+')"></i><i style="flex:'+(100-p)+';background:rgb('+pink+')"></i></div>'+
    '<div class="mix-label"><span>파랑 <b>'+p+'%</b></span><span>분홍 <b>'+(100-p)+'%</b></span></div>'+caption(frame?'파랑과 분홍의 몫을 합치면 언제나 <b>100%</b>예요.':'두 색이 같은 몫을 차지해요.');
}
function boardNotices(question,active,reveal) {
  const entries=[['모이는 장소','운동장 입구'],['시작 시간','오전 아홉 시']];
  return (question?'<div class="notice-question"><span>궁금한 것</span><b>“'+question+'”</b></div>':'')+
    '<div class="notices">'+entries.map(([title,body],i)=>'<div class="notice-paper '+(active===i?'matched':'')+'"><span>체육대회 안내</span><strong>'+title+'</strong>'+(reveal&&active===i?'<div class="paper-reveal">'+body+'</div>':'<div class="paper-lines" aria-label="가려진 본문"><i></i><i></i></div>')+'</div>').join('')+'</div>';
}
// Width shows a share. A moving dash follows the path from a value to the receiving position.
function flowChart(tokens,target,percent,colors,outputName,visible) {
  const pcts=[percent,100-percent],xs=[110,320],dest=215;
  const nodes=tokens.map((token,i)=>'<g><rect x="'+(xs[i]-77)+'" y="12" width="154" height="46" rx="12" fill="#3b354c" stroke="'+colors[i]+'"/><text x="'+xs[i]+'" y="42" class="flow-word">'+token+'</text></g>').join('');
  const wires=xs.map((x,i)=>{
    const d='M '+x+' 61 C '+x+' 117 '+dest+' 99 '+dest+' 152';
    return '<path d="'+d+'" class="wire" stroke="'+(visible?colors[i]:'#736b80')+'" stroke-width="'+(visible?3+pcts[i]*.12:2)+'"/>'+
      (visible?'<path d="'+d+'" class="rider" style="--delay:'+i*.2+'s"/>':'')+
      (visible?'<text x="'+(i?345:75)+'" y="102" class="flow-pct">'+pcts[i]+'%</text>':'');
  }).join('');
  return '<svg class="flow-chart" viewBox="0 0 430 218" role="img" aria-label="'+tokens[0]+(visible?' '+pcts[0]+'%, ':'와 ')+tokens[1]+(visible?' '+pcts[1]+'%, ':'에서 ')+target+' 자리로 정보 전달"><g text-anchor="middle">'+nodes+wires+
    '<rect x="113" y="154" width="204" height="50" rx="12" fill="'+outputName+'" stroke="#ddd6ee"/><text x="215" y="186" class="flow-result">‘'+target+'’ 자리의 결과</text></g></svg>';
}

}
function finish(){
  showDialog('수업 마무리','<div class="note-body"><span class="finish-icon">'+icon('check')+'</span><h3>오늘 찾은 단서 하나를 기억해요.</h3><p>어텐션은 한 자리에서 어떤 정보를 얼마씩 참고할지 정하고 그 비율대로 정보를 모아요. 여러분이 만든 두 문장에서 어떤 단서가 달라졌는지 친구에게 들려주세요.</p><div class="finish-actions"><button class="control" data-go="'+(quizStart-1)+'">원리 다시 보기</button><button class="primary" data-go="0">처음으로</button></div></div>');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-go')){go(Number(b.dataset.go));return;}
  if(b.hasAttribute('data-frame')){go(page,Number(b.dataset.frame));return;}
  if(b.hasAttribute('data-select')){
    state.choice=Number(b.dataset.select);
    byId('controls').querySelectorAll('button').forEach((btn,i)=>{btn.classList.toggle('on',i===state.choice);btn.setAttribute('aria-pressed',i===state.choice);});paintBoard();return;
  }
  if(b.hasAttribute('data-answer')){
    if(state.revealed)return;state.marked=Number(b.dataset.answer);
    byId('slide').querySelectorAll('[data-answer]').forEach((btn,i)=>{btn.classList.toggle('marked',i===state.marked);btn.setAttribute('aria-pressed',i===state.marked);});return;
  }
  if(b.id==='reveal'){revealAnswer();byId('reveal').focus({preventScroll:true});}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id!=='ratio'&&id!=='score')return;
  state[id]=Number(e.target.value);byId('rangeValue').value=state[id]+(id==='ratio'?'%':'');paintBoard();
});
byId('prev').onclick=previous;byId('next').onclick=nextPage;
byId('lectureTab').onclick=()=>go(lastLesson);byId('quizTab').onclick=()=>go(lastQuiz);byId('activityTab').onclick=()=>go(lastActivity);
byId('notes').onclick=notes;byId('indexBtn').onclick=toc;byId('close').onclick=()=>byId('dialog').close();
byId('dialog').onclick=e=>{if(e.target===byId('dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};
function fullUI(){
  const on=!!document.fullscreenElement||document.body.classList.contains('wide');
  document.body.classList.toggle('presenting',on);
  const toolbar=document.querySelector('.tools');
  if(on)byId('fullscreen').before(toolbar);else document.querySelector('.section-head').append(toolbar);
  byId('fullLabel').textContent=on?'전체 화면 종료':'전체 화면';
  byId('fullscreen').setAttribute('aria-pressed',on);
}
byId('fullscreen').onclick=async()=>{
  if(document.fullscreenElement){await document.exitFullscreen();return;}
  if(document.body.classList.contains('wide')){document.body.classList.remove('wide');fullUI();return;}
  try{await document.documentElement.requestFullscreen();}catch{document.body.classList.add('wide');fullUI();}
};
document.addEventListener('fullscreenchange',fullUI);
document.addEventListener('keydown',e=>{
  if(byId('dialog').open||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select')||e.repeat)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();nextPage();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();previous();}
  if(e.key==='Escape'&&document.body.classList.contains('wide')){document.body.classList.remove('wide');fullUI();}
});
window.addEventListener('hashchange',()=>{({page,frame}=readLocation());render();});
render();
</script>
